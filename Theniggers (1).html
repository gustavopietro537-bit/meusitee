<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BETA GAMES</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="BetaGamesProfile.png">

  <style>
    :root {
      --bg:#080808;
      --card:#0f0f10;
      --accent:#ff7a00;
      --muted:#bdbdbd;
    }

    * { box-sizing:border-box; }
    html,body {
      height:100%; margin:0;
      font-family:Inter,Segoe UI,system-ui,Arial;
      color:#eaeaea; background:var(--bg);
    }

    header {
      display:flex; align-items:center; justify-content:space-between;
      padding:18px 28px; border-bottom:1px solid rgba(255,255,255,0.03);
    }

    .brand { display:flex; gap:12px; align-items:center; }
    .logo img {
      width:44px; height:44px; border-radius:8px;
      box-shadow:0 6px 18px rgba(0,0,0,.6);
    }

    h1 { margin:0; font-size:20px; letter-spacing:1px; }
    h1 .orange { color:var(--accent); }

    nav { display:flex; gap:12px; }
    nav button {
      background:transparent; border:none; color:var(--muted);
      padding:8px 12px; border-radius:8px; cursor:pointer;
      font-weight:600;
    }
    nav button.active {
      color:var(--accent);
      background:rgba(255,122,0,0.08);
    }

    main {
      padding:40px;
      display:grid; place-items:center;
      min-height:calc(100vh - 88px);
    }

    .card {
      background:var(--card); padding:24px; border-radius:12px;
      max-width:980px; width:100%;
      box-shadow:0 8px 30px rgba(0,0,0,.6);
    }

    .intro {
      height:120px; display:flex; align-items:center; justify-content:center;
      overflow:hidden; position:relative;
    }
    .intro .word {
      font-size:48px; font-weight:800;
      transform:translateY(120%); opacity:0;
      transition:transform .7s cubic-bezier(.2,.9,.2,1), opacity .5s;
    }
    .intro.play .word {
      transform:translateY(0); opacity:1;
    }

    .games {
      display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:16px; margin-top:18px;
    }
    .game {
      background:#0b0b0b; padding:14px; border-radius:10px; text-align:center;
    }
    .game h3 { margin:8px 0; color:#fff; }
    .game button {
      margin-top:8px; padding:8px 12px;
      border-radius:8px; border:none;
      background:var(--accent); color:#000;
      font-weight:700; cursor:pointer;
    }

    .discord-list, .yt-list {
      display:flex; flex-direction:column; gap:10px;
    }
    .discord-list a, .yt-list a {
      display:inline-block; padding:10px 14px;
      border-radius:8px; background:rgba(255,255,255,0.03);
      text-decoration:none; color:var(--muted);
    }

    /* Cursor Demon Slayer */
    .custom-cursor {
      position:fixed; width:32px; height:32px;
      pointer-events:none; transform:translate(-50%,-50%);
      background:url("cursor.png") no-repeat center/contain;
      z-index:9999;
    }

    footer {
      padding:18px 28px; color:var(--muted);
      font-size:13px; text-align:center;
      border-top:1px solid rgba(255,255,255,0.02);
    }

    .music-control {
      margin-top:16px; text-align:center;
    }
    .music-btn {
      padding:10px 16px; background:var(--accent);
      border:none; border-radius:8px; cursor:pointer;
      font-weight:700; color:#000;
    }
  </style>
</head>

<body>

  <!-- Cursor Anime -->
  <div class="custom-cursor" id="cursor"></div>

  <!-- Música de Fundo -->
  <audio id="bgMusic" src="musica.mp3" loop></audio>

  <header>
    <div class="brand">
      <div class="logo"><img src="BetaGamesProfile.png" alt="logo"></div>
      <h1><span class="orange">BETA</span> <span style="color:#cfcfcf">GAMES</span></h1>
    </div>

    <nav>
      <button id="homeBtn" class="active">HOME</button>
      <button id="gamesBtn">JOGOS</button>
      <button id="discordBtn">DISCORD</button>
      <button id="youtubeBtn">YOUTUBE</button>
    </nav>
  </header>

  <main>
    <div class="card" id="contentArea">

      <!-- HOME -->
      <section id="homeSection">
        <div class="intro" id="introBox">
          <div class="word">Home</div>
        </div>
        <p style="color:var(--muted);text-align:center">
          Bem-vindo ao BETA GAMES!
          <br><br><strong>Créditos:</strong><br>
          Dark_77GG<br>
          miguelgames5734<br>
          RaidusYT1
        </p>

        <div class="music-control">
          <button class="music-btn" onclick="toggleMusic()">Play / Pause Música</button>
        </div>
      </section>

      <!-- JOGOS -->
      <section id="gamesSection" style="display:none">
        <h2>Jogos</h2>

        <div class="games">

          <div class="game">
            <div style="width:100%;height:120px;background:#111;border-radius:8px;margin-bottom:8px"></div>
            <h3>Jogo 1</h3>
            <button onclick="openLink('https://www.roblox.com/games/119776774057792/99-Nights-In-The-Modded')">JOGAR</button>
          </div>

          <div class="game">
            <div style="width:100%;height:120px;background:#111;border-radius:8px;margin-bottom:8px"></div>
            <h3>Jogo 2</h3>
            <button onclick="openLink('#')">EM BREVE</button>
          </div>

          <div class="game">
            <div style="width:100%;height:120px;background:#111;border-radius:8px;margin-bottom:8px"></div>
            <h3>Jogo 3</h3>
            <button onclick="openLink('#')">EM BREVE</button>
          </div>

        </div>
      </section>

      <!-- DISCORD -->
      <section id="discordSection" style="display:none">
        <h2>Discord</h2>
        <div class="discord-list">
          <a href="https://discord.gg/z2HkyXq68N" target="_blank">Servidor 1</a>
          <a href="https://discord.gg/5Dv7nT28" target="_blank">Servidor 2</a>
          <a href="https://discord.gg/SdaH2g2V" target="_blank">Servidor 3</a>
        </div>
      </section>

      <!-- YOUTUBE -->
      <section id="youtubeSection" style="display:none">
        <h2>Canais do YouTube</h2>

        <div class="yt-list">
          <a href="https://www.youtube.com/@Boonie0" target="_blank">Canal 1</a>
          <a href="https://www.youtube.com/@BRIAROT" target="_blank">Canal 2</a>
          <a href="#">Canal 3 — Em Breve</a>
        </div>

      </section>

    </div>
  </main>

  <footer>© BETA GAMES — Tema escuro com detalhes laranja</footer>


  <script>
    // Botões de navegação
    const sections = {
      home: document.getElementById("homeSection"),
      games: document.getElementById("gamesSection"),
      discord: document.getElementById("discordSection"),
      youtube: document.getElementById("youtubeSection")
    };

    function show(sec) {
      for (const s in sections) {
        sections[s].style.display = (s === sec) ? "" : "none";
      }
      document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
      document.getElementById(sec + "Btn").classList.add("active");
    }

    homeBtn.onclick = () => show("home");
    gamesBtn.onclick = () => show("games");
    discordBtn.onclick = () => show("discord");
    youtubeBtn.onclick = () => show("youtube");

    // Cursor
    const cursor = document.getElementById("cursor");
    document.addEventListener("mousemove", e => {
      cursor.style.left = e.clientX + "px";
      cursor.style.top = e.clientY + "px";
    });

    // Música
    const bgMusic = document.getElementById("bgMusic");
    function toggleMusic() {
      bgMusic.paused ? bgMusic.play() : bgMusic.pause();
    }

    // Abrir link
    function openLink(h) { window.open(h, "_blank"); }
  </script>

</body>
</html>
